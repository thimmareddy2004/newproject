<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Fleet - GoAround</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1f2937 0%, #111827 50%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Animated Background Grid */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: 
                linear-gradient(rgba(251, 191, 36, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(251, 191, 36, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
            position: relative;
            z-index: 1;
        }

        /* Header Section */
        .header {
            text-align: center;
            padding: 5rem 0 3rem;
            position: relative;
        }

        .header h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, #ffffff, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(251, 191, 36, 0.3);
        }

        .header .accent {
            color: #fbbf24;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
        }

        .header p {
            font-size: 1.25rem;
            color: #d1d5db;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Vehicle Type Toggle */
        .vehicle-type-toggle {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .toggle-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #374151, #4b5563);
            color: #d1d5db;
            border: 2px solid #4b5563;
            border-radius: 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
            justify-content: center;
        }

        .toggle-btn:hover {
            background: linear-gradient(135deg, #4b5563, #6b7280);
            border-color: rgba(251, 191, 36, 0.5);
            transform: translateY(-2px);
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            border-color: #fbbf24;
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.4);
        }

        .toggle-icon {
            font-size: 1.5rem;
        }

        /* Vehicle Grid */
        .vehicle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 2rem;
            padding: 2rem 0;
        }

        /* Vehicle Card */
        .vehicle-card {
            background: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            border-radius: 1.5rem;
            overflow: hidden;
            position: relative;
            border: 1px solid #374151;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .vehicle-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(251, 191, 36, 0.5);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .vehicle-card.selected {
            border-color: #fbbf24;
            box-shadow: 0 0 30px rgba(251, 191, 36, 0.4);
        }

        /* Vehicle Image */
        .vehicle-image {
            position: relative;
            height: 250px;
            overflow: hidden;
            background: #374151;
        }

        .vehicle-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .vehicle-card:hover .vehicle-image img {
            transform: scale(1.1);
        }

        .vehicle-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 0%, rgba(0, 0, 0, 0.6) 100%);
        }

        /* Price Badge */
        .price-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-weight: 700;
            font-size: 0.9rem;
            box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4);
            z-index: 2;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 12px rgba(251, 191, 36, 0.4); }
            50% { box-shadow: 0 8px 25px rgba(251, 191, 36, 0.8); }
        }

        /* Rating Badge */
        .rating-badge {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 0.5rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 2;
        }

        .rating-badge .star {
            color: #fbbf24;
            margin-right: 0.25rem;
        }

        /* Vehicle Info */
        .vehicle-info {
            padding: 1.5rem;
        }

        .vehicle-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .vehicle-title h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.25rem;
            transition: color 0.3s ease;
        }

        .vehicle-card:hover .vehicle-title h3 {
            color: #fbbf24;
        }

        .vehicle-type {
            color: #fbbf24;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .capacity-badge {
            display: flex;
            align-items: center;
            background: #374151;
            padding: 0.5rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            color: #d1d5db;
            transition: all 0.3s ease;
        }

        .vehicle-card:hover .capacity-badge {
            background: #4b5563;
        }

        .capacity-icon {
            margin-right: 0.25rem;
        }

        .vehicle-description {
            color: #9ca3af;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        /* Features */
        .features {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .feature-tag {
            background: linear-gradient(135deg, #374151, #4b5563);
            color: #d1d5db;
            padding: 0.4rem 0.8rem;
            border-radius: 1rem;
            font-size: 0.8rem;
            border: 1px solid #4b5563;
            transition: all 0.3s ease;
        }

        .feature-tag:hover {
            background: #fbbf24;
            color: #1f2937;
            transform: scale(1.05);
        }

        /* Book Now Button */
        .book-btn {
            width: 100%;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1f2937;
            padding: 0.875rem 1.5rem;
            border: none;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: block;
            text-align: center;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.3);
        }

        .book-btn:hover {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.5);
        }

        /* Navigation */
        .nav-home {
            position: fixed;
            top: 2rem;
            left: 2rem;
            background: rgba(31, 41, 55, 0.9);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1.5rem;
            border-radius: 2rem;
            border: 1px solid #374151;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .nav-home:hover {
            background: rgba(251, 191, 36, 0.2);
            border-color: #fbbf24;
            color: #fbbf24;
        }

        /* Loading Animation */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }

        .spinner {
            width: 3rem;
            height: 3rem;
            border: 3px solid #374151;
            border-top: 3px solid #fbbf24;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Fade-in animation */
        .fade-in {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 0 0.75rem;
            }

            .header {
                padding: 3rem 0 2rem;
            }

            .header h1 {
                font-size: 2.5rem;
            }

            .vehicle-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .vehicle-card {
                margin: 0 0.5rem;
            }

            .nav-home {
                top: 1rem;
                left: 1rem;
                padding: 0.5rem 1rem;
                font-size: 0.9rem;
            }

            .vehicle-image {
                height: 200px;
            }
            
            .vehicle-type-toggle {
                flex-direction: column;
                gap: 0.75rem;
                margin-bottom: 2rem;
            }
            
            .toggle-btn {
                padding: 0.75rem 1.5rem;
                font-size: 1rem;
                min-width: auto;
            }
        }
    </style>
</head>

        let currentVehicleType = 'cars';
        let vehicles = carsData;

        // Create vehicle card HTML
        function createVehicleCard(vehicle, index) {
            return `
                <div class="vehicle-card fade-in" style="transition-delay: ${index * 0.1}s" data-vehicle="${vehicle.id}">
                    <div class="vehicle-image">
                        <img src="${vehicle.image}" alt="${vehicle.name}" loading="lazy" onerror="this.src='/static/images/rent.jpg'">

                        <div class="price-badge">${vehicle.localRate}</div>
                        <div class="rating-badge">
                            <span class="star">★</span>
                            <span>${vehicle.rating}</span>
                        </div>
                    </div>
                    
                    <div class="vehicle-info">
                        <div class="vehicle-header">
                            <div class="vehicle-title">
                                <h3>${vehicle.name}</h3>
                                <div class="vehicle-type">${vehicle.type}</div>
                            </div>
                            <div class="capacity-badge">
                                <span class="capacity-icon">👥</span>
                                <span>${vehicle.capacity}</span>
                            </div>
                        </div>
                        
                        <p class="vehicle-description">${vehicle.description}</p>
                        
                        <div class="features">
                            ${vehicle.features.map(feature => `
                                <span class="feature-tag">${feature}</span>
                            `).join('')}
                        </div>
                        
                        <a href="/taxi-rental?vehicle=${vehicle.id}&type=${currentVehicleType}" class="book-btn">
                            Book Now
                        </a>
                    </div>
                </div>
            `;
        }

        // Render vehicles
        function renderVehicles() {
            const grid = document.getElementById('vehicleGrid');
            const loading = document.getElementById('loading');
            
            // Show loading
            loading.style.display = 'flex';
            grid.innerHTML = '<div class="loading" id="loading"><div class="spinner"></div></div>';
            
            setTimeout(() => {
                loading.style.display = 'none';
                grid.innerHTML = vehicles.map((vehicle, index) => 
                    createVehicleCard(vehicle, index)
                ).join('');
                
                // Trigger animations
                setTimeout(() => {
                    const cards = document.querySelectorAll('.vehicle-card');
                    cards.forEach(card => card.classList.add('visible'));
                }, 100);
                
                // Add click handlers
                addClickHandlers();
            }, 800);
        }

        // Add click handlers for vehicle selection
        function addClickHandlers() {
            const cards = document.querySelectorAll('.vehicle-card');
            cards.forEach(card => {
                card.addEventListener('click', function(e) {
                    if (!e.target.classList.contains('book-btn')) {
                        // Remove selected class from all cards
                        cards.forEach(c => c.classList.remove('selected'));
                        // Add selected class to clicked card
                        this.classList.add('selected');
                    }
                });
            });
        }

        // Toggle between cars and bikes
        function toggleVehicleType(type) {
            currentVehicleType = type;
            vehicles = type === 'cars' ? carsData : bikesData;
            
            // Update toggle buttons
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.type === type);
            });
            
            // Update header text
            const mainTitle = document.getElementById('mainTitle');
            const mainSubtitle = document.getElementById('mainSubtitle');
            
            if (type === 'cars') {
                mainTitle.innerHTML = 'Our Premium <span class="accent">Fleet</span>';
                mainSubtitle.textContent = 'Choose from our diverse range of well-maintained vehicles for every travel need';
            } else {
                mainTitle.innerHTML = 'Our Premium <span class="accent">Bikes</span>';
                mainSubtitle.textContent = 'Choose from our diverse range of well-maintained bikes for every travel need';
            }
            
            // Re-render vehicles
            renderVehicles();
        }
        
        // Setup toggle event listeners
        function setupToggleListeners() {
            document.getElementById('carsToggle').addEventListener('click', () => toggleVehicleType('cars'));
            document.getElementById('bikesToggle').addEventListener('click', () => toggleVehicleType('bikes'));
        }

        // Initialize fade-in animation observer
        function initializeAnimations() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                    }
                });
            }, { threshold: 0.1 });

            // Observe header
            const header = document.querySelector('.header');
            observer.observe(header);
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', function() {
            setupToggleListeners();
            renderVehicles();
            initializeAnimations();
            
            console.log('Cars data:', carsData.length);
            console.log('Bikes data:', bikesData.length);
        });
    </script>
</body>
</html>
