<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sign In / Sign Up</title>
  <style>
    /* Your existing CSS exactly as before */
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: #ffd600;
      margin: 0;
      min-height: 100vh;
      padding-top: 130px;
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }
    #signup-bg-video {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 0;
      filter: brightness(0.5);
    }
    .top-intro-text {
      position: fixed;
      top: 56px;
      left: 0;
      right: 0;
      max-width: 100vw;
      padding: 10px 30px;
      z-index: 1001;
      color: #ffd600;
      background-color: rgba(34, 34, 34, 0.95);
      font-weight: 600;
      font-size: 1rem;
      text-align: left;
      line-height: 1.5;
      box-shadow: 0 0 12px #ffc107;
      border-radius: 0 0 10px 10px;
      letter-spacing: 0.02em;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }
    .main-flex {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 3vw;
      min-height: 80vh;
      margin-top: 50px;
      position: relative;
      z-index: 2;
    }
    .side-media {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
      margin-top: 40px;
      width: 240px;
    }
    .side-video, .side-img {
      width: 240px;
      height: 310px;
      object-fit: cover;
      border-radius: 14px;
      box-shadow: 0 0 14px #ffd600;
      background: #222;
    }
    .auth-panel {
      background: rgba(51,51,51,0.97);
      box-shadow: 0 0 28px #ffc107;
      border-radius: 16px;
      min-width: 420px;
      max-width: 440px;
      padding: 2rem 2rem 2.5rem 2rem;
      text-align: center;
      position: relative;
      z-index: 2;
      margin-left: 40px;
      margin-right: 40px;
    }
    .auth-panel h1 {
      color: #ffd600;
      margin-bottom: 2rem;
    }
    input {
      width: 95%;
      padding: 0.8rem;
      margin: 0.7rem 0;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      width: 100%;
      padding: 1em;
      background: #ffd600;
      color: #222;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      margin-top: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 1rem;
    }
    button:hover {
      background: #ffb300;
      color: #fff;
    }
    .link-btn {
      background: none;
      color: #ffd600;
      border: none;
      text-decoration: underline;
      cursor: pointer;
      margin-top: 1rem;
      font-size: 1rem;
    }
    .link-btn:hover {
      color: #ffb300;
    }
    @media (max-width: 1200px) {
      .main-flex {
        flex-direction: column;
        gap: 2rem;
        align-items: center;
      }
      .side-media {
        flex-direction: row;
        justify-content: center;
        margin-top: 0;
        gap: 12vw;
        width: 100vw;
      }
      .side-video, .side-img {
        width: 49vw;
        height: 160px;
      }
      .auth-panel {
        margin-left: auto;
        margin-right: auto;
        min-width: 95vw;
        max-width: 95vw;
      }
    }
  </style>
</head>
<body>
  <video autoplay muted loop playsinline id="signup-bg-video">
    <source src="{{ url_for('static', filename='video/forest.mp4') }}" type="video/mp4" />
  </video>

  <div class="top-intro-text" id="typed-text"></div>

  <div class="main-flex">
    <div class="side-media" id="left-media">
      <video class="side-video" autoplay muted loop playsinline>
        <source src="{{ url_for('static', filename='video/forest.mp4') }}" type="video/mp4" />
      </video>
      <img src=+ class="side-img" alt="Travel Pic Left" />
    </div>

    <div class="auth-panel">
      <!-- Sign In Form -->
      <form id="signin-form" style="display: block;" method="POST" action="/signin">
        <h1>Sign In</h1>
        <input type="email" name="email" placeholder="Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
        <button type="button" class="link-btn" onclick="showSignup()">Don't have an account? Sign Up</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" style="display: none;" method="POST" action="/signup">
        <h1>Sign Up</h1>
        <input type="text" name="first_name" placeholder="First Name" required />
        <input type="text" name="last_name" placeholder="Last Name" required />
        <input type="email" name="email" placeholder="Email Address" required />
        <input type="tel" name="phone" placeholder="Phone Number" required />
        <input type="password" name="password" placeholder="Create Password" required />
        <input type="password" name="confirm_password" placeholder="Confirm Password" required />
        <button type="submit">Submit</button>
        <button type="button" class="link-btn" onclick="showSignin()">Already have an account? Sign In</button>
      </form>
    </div>

    <div class="side-media" id="right-media">
      <video class="side-video" autoplay muted loop playsinline>
        <source src="{{ url_for('static', filename='video/Dream_fixed.mp4') }}" type="video/mp4" />
      </video>
      <img src="{{ url_for('static', filename='images/falls.png') }}" class="side-img" alt="Travel Pic Right" />
    </div>
  </div>

  <script>
    const introText = "Welcome to Step Out — your personalized companion for seamless trip planning. Our platform empowers you to craft your travel experiences exactly as you envision them. We provide detailed travel itineraries, guidance, and advice tailored to your unique preferences. Discover recommendations for the best seasons to visit each destination, connect with fellow travelers, and access expert insights from others using our community. With our intelligent budget calculator, you can estimate trip costs based on your chosen transportation. We also suggest clean, affordable hotels offering delicious local cuisine. Our goal is to make your journey enjoyable, budget-friendly, and perfectly planned from start to finish.";

    let i = 0;
    function typeWriter() {
      if (i < introText.length) {
        document.getElementById("typed-text").innerHTML += introText.charAt(i);
        i++;
        setTimeout(typeWriter, 13);
      }
    }
    window.onload = typeWriter;

    function showSignup() {
      document.getElementById('typed-text').style.display = 'none';
      document.getElementById('signin-form').style.display = 'none';
      document.getElementById('signup-form').style.display = 'block';
      document.getElementById('left-media').style.display = 'none';
      document.getElementById('right-media').style.display = 'none';
      document.getElementById('signup-bg-video').style.display = 'block';
    }

    function showSignin() {
      document.getElementById('typed-text').style.display = 'block';
      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('signin-form').style.display = 'block';
      const signupInputs = document.querySelectorAll('#signup-form input');
      signupInputs.forEach(input => input.value = '');
      document.getElementById('left-media').style.display = 'flex';
      document.getElementById('right-media').style.display = 'flex';
      document.getElementById('signup-bg-video').style.display = 'none';
    }
  </script>
</body>
</html>
